<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Registrasi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #a0c4d8;
            min-height: 100vh;
        }
        .header-bg {
            background-color: #008b8b;
            color: white;
            padding: 15px 20px;
        }
        .header-content {
            display: flex;
            align-items: center;
        }
        pre {
            margin: 0;
            color: black;
        }
        .card-custom {
            width: 100%;
            max-width: 550px;
            border-radius: 8px;
        }
    </style>
</head>
<body class="d-flex flex-column">

    <header class="header-bg">
        <div class="header-content">
            <img src="logo.png" alt="Logo Learnify" width="40" class="me-2">
            <pre>Learnify  <small style="font-size: 0.8rem; opacity: 0.8;">Belajar Santai, Sukses Sesuai</small></pre>
        </div>
    </header>

    <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3 my-4">
        <div class="card card-custom shadow-sm p-4 bg-white">
            <h5 class="text-center mb-4 fw-bold">Registrasi Pengguna Baru</h5>
            
            <form id="Form">
                <table class="table table-borderless align-middle fs-6">
                    <tbody>
                        <tr>
                            <td style="width: 35%;"><label for="email">Email Kampus</label></td>
                            <td><input type="email" id="email" class="form-control form-control-sm" placeholder="nama@example.com" required></td>
                        </tr>
                        <tr>
                            <td><label for="nama">Nama Lengkap</label></td>
                            <td><input type="text" id="nama" class="form-control form-control-sm" placeholder="sesuai dengan KTP" required></td>
                        </tr>
                        <tr>
                            <td><label for="password">Password</label></td>
                            <td><input type="password" id="password" class="form-control form-control-sm" placeholder="max 8 karakter" maxlength="8" required></td>
                        </tr>
                        <tr>
                            <td><label>Jenis Kelamin</label></td>
                            <td>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="jk" id="laki" value="Laki-Laki">
                                    <label class="form-check-label" for="laki">Laki-Laki</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="jk" id="perempuan" value="Perempuan">
                                    <label class="form-check-label" for="perempuan">Perempuan</label>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td><label>Tanggal Lahir</label></td>
                            <td>
                                <div class="d-flex gap-1">
                                    <select class="form-select form-select-sm">
                                        <option selected disabled>Tanggal</option>
                                        <option>1</option><option>2</option><option>3</option>
                                    </select>
                                    <select class="form-select form-select-sm">
                                        <option selected disabled>Bulan</option>
                                        <option>Januari</option><option>Februari</option>
                                    </select>
                                    <select class="form-select form-select-sm">
                                        <option selected disabled>Tahun</option>
                                        <option>2000</option><option>2001</option>
                                    </select>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="fakultas">Fakultas</label></td>
                            <td>
                                <select id="fakultas" class="form-select form-select-sm">

                                    <option selected disabled>Fakultas</option>
                                    <option>Fakultas Teknik Industri</option>
                                    <option>Fakultas Teknik Mineral dan Energi</option>
                                </select>
                            </td>
                        </tr>
                        <tr>
                            <td><label for="alamat">Alamat Lengkap</label></td>
                            <td><textarea id="alamat" class="form-control form-control-sm" rows="2" placeholder="Sesuai KTP"></textarea></td>
                        </tr>
                        <tr>
                            <td><label>Unit Kegiatan Mahasiswa</label></td>
                            <td>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="seni">
                                    <label class="form-check-label" for="seni">Seni</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="belaDiri">
                                    <label class="form-check-label" for="belaDiri">Bela Diri</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" id="sains">
                                    <label class="form-check-label" for="sains">Sains</label>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <div class="d-flex justify-content-end mt-3">
                    <button onclick="event" class="btn btn-info">Tambahkan Pengguna</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('Form').addEventListener('submit', function(event) {
            event.preventDefault();
            
            alert("data Pengguna Berhasil Ditambahkan!");
            
            document.getElementById('page-title').innerText = "Berhasil!";
        });
    </script>
</body>
</html>
