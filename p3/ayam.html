<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Anak Ayam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <div class="d-flex justify-content-center py-5">
        <button onclick="anakAyam()" class="btn btn-success">
            Mulai Program
        </button>
    </div>

    <script>
        function anakAyam() {
            let nama = prompt("Masukkan nama ayam")
            let jumlah = parseInt(prompt("Masukkan jumlah anak ayam"))

            for (let index = jumlah; index >= 1; index--) {
                if (index > 1) {
                    document.write(" Anak ayam turun " + index + "\nMati satu tinggal " + (index - 1) + "<br>")
                } else {
                    document.write(" Anak ayam turun 1" + "\nMati satu " + nama + " galau" + "<br>")
                }   
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
